<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thank You</title>
  <style>
/* ====== White background + brand gradient letters (like welcome) ====== */
*{box-sizing:border-box} html,body{height:100%}
body{
  margin:0; background:#ffffff; color:#111;
  font-family:'Roboto',system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;
  display:grid; place-items:center; padding:20px; overflow:hidden;
}
.outro{ text-align:center; padding:24px; }
.headline{
  margin:0 0 10px;
  font-weight:900; letter-spacing:.02em;
  font-size:clamp(30px,7vw,72px);
  line-height:1.05;
  display:grid;            /* ensures vertical spacing between lines */
  gap:clamp(6px,2.2vw,14px);
}
.line{ display:inline-block; white-space:nowrap }
.sub{ margin:0; font-size:clamp(14px,2.3vw,18px); color:#666 }

/* Each character uses the same brand gradient as buttons in style_white2.css */
.letter{
  display:inline-block; will-change:transform,opacity,filter;
  transform-origin:center;
  background: linear-gradient(90deg,
    #FF6B6B 0%,
    #FFC94A 25%,
    #1A73E8 50%,
    #2ECC71 75%,
    #FF6B6B 100%
  );
  background-size:300% 100%;
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
  filter:drop-shadow(0 6px 18px rgba(0,0,0,.08));
  animation:popIn .5s cubic-bezier(.2,.8,.2,1) both, hueSlide 6s linear infinite;
}

/* Extra spacing control */
.letter + .letter{ margin-left:.02em } /* gentle letter-space */
.letter.space{ width:.42em; }         /* consistent space width */
.letter.nbsp{ width:.42em; }          /* in case we mark &nbsp; */

/* Animations */
@keyframes hueSlide{0%{background-position:0% 50%}100%{background-position:100% 50%}}
@keyframes popIn{
  0%{ opacity:0; transform:translateY(14px) scale(.92) rotate(-3deg); filter:blur(1px) drop-shadow(0 0 0 rgba(0,0,0,0))}
  60%{ opacity:1; transform:translateY(0) scale(1.04) rotate(2deg)}
  100%{ opacity:1; transform:translateY(0) scale(1) rotate(0)}
}

/* Explode */
.headline.exploding .letter{
  animation:popIn .5s cubic-bezier(.2,.8,.2,1) both, explode 800ms cubic-bezier(.16,.7,.1,1) var(--delay,0ms) forwards;
}
@keyframes explode{
  0%{ opacity:1; transform:translate(0,0) scale(1) rotate(0deg) }
  35%{ transform:translate(calc(var(--x)/6), calc(var(--y)/6)) scale(1.08) rotate(10deg) }
  100%{ opacity:0; transform:translate(var(--x),var(--y)) scale(.2) rotate(var(--r)) }
}

/* Reduced motion */
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{ animation:none !important; transition:none !important }
}
  </style>
</head>
<body>
  <div class="outro">
    <h1 class="headline" id="headline">
      <span class="line">THANK YOU</span>
      <span class="line">FOR VISITING</span>
      <span class="line">SEE YOU</span>
      <span class="line">NEXT TIME</span>
    </h1>
    <p class="sub">Click anywhere or press R to replay</p>
  </div>

  <script>
(function(){
  function wrapLettersIn(el){
    const lines = el.querySelectorAll('.line');
    lines.forEach((line)=>{
      const txt = line.textContent;
      line.textContent = '';
      [...txt].forEach((ch,i)=>{
        const span = document.createElement('span');
        span.className = 'letter';
        // keep spaces visible with fixed width
        if(ch === ' '){
          span.classList.add('space','nbsp');
          span.textContent = '\ ';
        }else{
          span.textContent = ch;
        }
        span.dataset.i = i;
        line.appendChild(span);
      });
    });
  }

  function explode(el){
    el.classList.add('exploding');
    el.querySelectorAll('.letter').forEach((span,i)=>{
      span.style.setProperty('--delay', (i*34)+'ms');
      span.style.setProperty('--x', (Math.random()*320-160)+'px');
      span.style.setProperty('--y', (Math.random()*220-110)+'px');
      span.style.setProperty('--r', (Math.random()*720-360)+'deg');
    });
    setTimeout(()=>{
      el.classList.remove('exploding');
      // rebuild letters to reset state cleanly
      el.querySelectorAll('.line').forEach(line=>{
        line.innerHTML = line.textContent;
      });
      wrapLettersIn(el);
    },1000);
  }

  document.addEventListener('DOMContentLoaded',()=>{
    const headline = document.getElementById('headline');
    wrapLettersIn(headline);
    document.addEventListener('click', ()=>explode(headline));
    document.addEventListener('keydown', (e)=>{ if(e.key.toLowerCase()==='r') explode(headline); });
  });
})();
  </script>
</body>
</html>
