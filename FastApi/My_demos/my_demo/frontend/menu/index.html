<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reservation Place</title>

  <!-- Fonts & Icons -->
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"/>

  <!-- Datepicker -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css"/>
</head>
<body>
  <div class="container">
    <div class="card seats-card">
      <h1 class="welcome-title">Show All Seats</h1>
      <p class="subtitle">Select a seat to view details or make a reservation.</p>

      

      <div class="legend-modern">
        <div class="legend-item"><span class="seat-symbol free"><i class="fas fa-desktop"></i></span><span>Unreserved</span></div>
        <div class="legend-item"><span class="seat-symbol reserved"><i class="fas fa-user-tie"></i></span><span>Reserved</span></div>
        <div class="legend-item"><span class="seat-symbol reserved-D"><i class="fas fa-laptop-house"></i></span><span>Docking station</span></div>
        <div class="legend-item"><span class="seat-symbol reserved-S"><i class="fas fa-chalkboard-teacher"></i></span><span>Two screens</span></div>
        <div class="legend-item"><span class="seat-symbol reserved-E"><i class="fas fa-cogs"></i></span><span>Elec. desk adjustment</span></div>
        <div class="legend-item"><span class="seat-symbol reserved-DS"><i class="fas fa-laptop-code"></i></span><span>D. station & 2 screens</span></div>
        <div class="legend-item"><span class="seat-symbol reserved-DSE"><i class="fas fa-rocket"></i></span><span>Full</span></div>
      </div>

      <!-- SYSTEM 1: REZERWUJ -->
      
        
        

        <div class="floor-section">
          <h2 class="floor-title">Floor 4 (20 seats)</h2>
          <div class="seats-grid" id="floor-4-seats"></div>
        </div>

        <div class="floor-section">
          <h2 class="floor-title">Floor 5 (30 seats)</h2>
          <div class="seats-grid" id="floor-5-seats"></div>
        </div>

        <div class="floor-section">
          <h2 class="floor-title">Floor 6 (25 seats)</h2>
          <div class="seats-grid" id="floor-6-seats"></div>
        </div>

        <div class="floor-section">
          <h2 class="floor-title">Floor 7 (35 seats)</h2>
          <div class="seats-grid" id="floor-7-seats"></div>
        </div>

        <div class="summary" id="summary"></div>
      </section>

      <!-- SYSTEM 2: ANULUJ -->
      <section id="tab-cancel" class="tab-panel">
        <div class="cancel-tools">
          <input type="text" id="cancelId" class="input" placeholder="ID reservation..." />
          <input type="text" id="cancelDate" class="input" placeholder="Date reservation..." />
          <button id="btnFind" class="btn"><i class="fas fa-search"></i> <Search></Search></button>
          <button id="btnListAll" class="btn alt"><i class="fas fa-list"></i> All</button>
        </div>
        <div id="cancelResults" class="results"></div>
      </section>
    </div>
  </div>

  <!-- Modal rezerwacji -->
  <div class="modal" id="reserveModal" aria-hidden="true">
    <div class="modal-backdrop" data-close></div>
    <div class="modal-card">
      <button class="modal-close" data-close><i class="fas fa-times"></i></button>
      <h3><i class="fas fa-calendar-plus"></i> New reservation</h3>
      <form id="reserveForm">
        <div class="form-row">
          <label>Place</label>
          <input type="text" id="formSeat" class="input" readonly />
        </div>
        <div class="form-row">
          <label>Name and Surname</label>
          <input type="text" id="formName" class="input" required />
        </div>
        <div class="form-row">
          <label>Email</label>
          <input type="email" id="formEmail" class="input" required />
        </div>
        <div class="form-row">
          <label>Date</label>
          <input type="text" id="formDate" class="input" required />
        </div>
        <div class="form-row">
          <label>Comments</label>
          <textarea id="formNotes" class="input" rows="3" placeholder="e.g . I need adapter USB-C..."></textarea>
        </div>
        <div class="form-actions">
          <button type="submit" class="btn primary"><i class="fas fa-check"></i> Book now</button>
        </div>
      </form>
      <div class="tiny-note" id="reservationInfo"></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
  <script src="./script.js"></script>
  <link rel="stylesheet" href="./style.css"/>
</body>
</html>
