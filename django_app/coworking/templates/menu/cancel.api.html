<!DOCTYPE html>

{% load static %}
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Anuluj rezerwację (API)</title>
  <meta name="api-base-url" content="http://localhost:3000">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"/>
  <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
  <script src="https://cdn.jsdelivr.net/npm/qrcodejs/qrcode.min.js"></script>
  <style>
    :root { --border: rgba(0,0,0,.12); --muted:#666; }
    * { box-sizing: border-box; }
    body { font-family: Roboto, system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, 'Noto Sans', Arial; margin:0; background:#fafafa; }
    .container { max-width: 980px; margin: 0 auto; padding: 24px; }
    .card { background: #fff; border: 1px solid var(--border); border-radius: 12px; padding: 20px; box-shadow: 0 4px 18px rgba(0,0,0,.06); }
    .welcome-title { margin: 0 0 4px; font-size: 20px; }
    .subtitle { margin-top: 0; color: #555; }
    .cancel-tools { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 10px; align-items: center; margin-bottom: 16px; }
    .cancel-tools .btn { height: 40px; }
    .input { height: 40px; padding: 8px 10px; border-radius: 8px; border: 1px solid rgba(0,0,0,.2); background:#fff; }
    .btn { border: 1px solid rgba(0,0,0,.2); background: #fff; padding: 8px 12px; border-radius: 8px; cursor: pointer; }
    .btn.primary { background: #0d6efd; color: #fff; border-color: #0d6efd; }
    .btn.alt { background: #f2f2f2; }
    .results { display: grid; gap: 10px; min-height: 40px; }
    .row { display: grid; grid-template-columns: 110px 120px 80px 1fr 160px; align-items: center; gap: 8px; border: 1px solid var(--border); border-radius: 10px; padding: 10px; background:#fff; }
    .row .actions { display: flex; gap: 8px; justify-content: flex-end; }
    .empty { padding: 16px; color: var(--muted); text-align: center; border: 1px dashed var(--border); border-radius: 10px; background:#fff; }
    .muted { color: var(--muted); }
    .inline-spinner { display:inline-flex; align-items:center; gap:8px; }
    .spinner { width:16px; height:16px; border-radius:50%; border:2px solid #ccc; border-top-color:#111; animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg);} }

    .modal { position: fixed; inset: 0; display: none; }
    .modal.open { display: block; }
    .modal-backdrop { position: absolute; inset: 0; background: rgba(0,0,0,.5); }
    .modal-card { position: relative; z-index: 1; width: min(520px, calc(100% - 32px)); margin: 7vh auto; background: #fff; border-radius: 14px; padding: 18px; box-shadow: 0 10px 30px rgba(0,0,0,.25); }
    .modal-close { position: absolute; right: 10px; top: 10px; border: none; background: transparent; font-size: 18px; cursor: pointer; }
    .form-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }
    .error { padding:10px; background:#fff1f1; border:1px solid #f3c2c2; color:#a40000; border-radius:10px; }
  </style>
</head>
<body>
<div class="container">
  <div class="card">
    <h1 class="welcome-title">Cancel reservation</h1>
    <p class="subtitle">Search and cancel existing reservations (API)</p>

    <div class="cancel-tools">
      <input type="text" id="filterId" class="input" placeholder="ID reservation..." />
      <input type="text" id="filterDate" class="input" placeholder="Date (YYYY-MM-DD)..." />
      <input type="text" id="filterSeat" class="input" placeholder="Place..." />
      <input type="text" id="filterName" class="input" placeholder="Name/Last Name..." />
      <button id="btnSearch" class="btn"><i class="fas fa-search"></i> Search</button>
      <button id="btnListAll" class="btn alt"><i class="fas fa-list"></i> All</button>
      <button id="btnExportCSV" class="btn alt"><i class="fas fa-file-csv"></i> CSV</button>
      <button id="btnExportJSON" class="btn alt"><i class="fas fa-file-code"></i> JSON</button>
    </div>

    <div id="feedback"></div>
    <div id="results" class="results"></div>
  </div>
</div>

<div class="modal" id="confirmModal" aria-hidden="true">
  <div class="modal-backdrop" data-close></div>
  <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="confirmTitle">
    <button class="modal-close" data-close><i class="fas fa-times"></i></button>
    <h3 id="confirmTitle">Confirm cancellation</h3>
    <div id="confirmDetails"></div>
    <div class="form-actions">
      <button id="btnConfirmCancel" class="btn primary"><i class="fas fa-check"></i> Yes, cancel</button>
      <button class="btn" data-close>No</button>
    </div>
  </div>
</div>

<script src="{% static 'frontend/menu/script.api.js' %}"></script>
</body>
</html>
