<!DOCTYPE html>

{% load static %}
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Application - Registration</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'frontend/login/style.css' %}">
    <link rel="stylesheet" href="{% static 'frontend/login/style_login_inputs_upgrade.css' %}">
<link rel="stylesheet" href="{% static 'frontend/common/auth_password_strength.css' %}">
<link rel="stylesheet" href="{% static 'frontend/common/auth_password_strength_fix.css' %}">
</head>
<body>
    <div class="container">
        <div class="card">
            <h1>Registration</h1>
            <p>Please fill out the form to create an account.</p>
            <form class="registration-form" id="regForm">
                <div class="form-group">
                    <label for="firstName">First Name</label>
                    <input type="text" id="firstName" name="firstName" required>
                </div>
                <div class="form-group">
                    <label for="lastName">Last Name</label>
                    <input type="text" id="lastName" name="lastName" required>
                </div>
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" required>
                </div>
                <div class="form-group password-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required>
                    <button type="button" class="toggle-password" data-password-toggle="#password">👁</button>
                    <div class="password-strength" id="password-strength"></div>
                </div>
                <div class="button-group">
                    <button type="submit" class="btn btn-primary">Register</button>
                    <button type="button" class="btn btn-tertiary" id="btnCancel" data-action="cancel">Cancel</button>

                </div>
            </form>
        </div>
    </div>
<script>
(function(){
  var pwd = document.getElementById('password');
  var btn = document.querySelector('.toggle-password,[data-password-toggle]');
  if(pwd && btn){
    btn.addEventListener('click', function(){ pwd.type = (pwd.type === 'password' ? 'text' : 'password'); });
  }
})();

(function(){
  var cancel = document.querySelector('#btnCancel,[data-action="cancel"],.btn-tertiary');
  if(cancel){
    cancel.addEventListener('click', function(e){
      e.preventDefault();
      var href = cancel.getAttribute('data-href');
      if(href){ location.href = href; }
      else if(document.referrer){ history.back(); }
      else { location.href = '/welcome/index.html'; }
    });
  }
})();

(function(){
  var input = document.getElementById('password');
  if(!input) return;
  var box = document.getElementById('password-strength');
  if(!box) return;

  function score(pw){
    if(!pw) return 0;
    var s=0;
    if(pw.length>=8) s++;
    if(pw.length>=12) s++;
    if(/[a-z]/.test(pw)) s++;
    if(/[A-Z]/.test(pw)) s++;
    if(/[0-9]/.test(pw)) s++;
    if(/[^A-Za-z0-9]/.test(pw)) s++;
    if(/password|qwerty|123456|abc123|admin|letmein|iloveyou/i.test(pw)) s=Math.max(0,s-3);
    return Math.min(s,6);
  }
  function label(sc){ return sc<=2 ? 'Weak' : (sc<=4 ? 'Medium' : 'Strong'); }

  input.addEventListener('input', function(){
    var sc = score(input.value);
    box.textContent = 'Strength: ' + label(sc);
  });
})();
</script>

    <script src="{% static 'frontend/registration/form.js' %}"></script>
    <link rel="stylesheet" href="{% static 'frontend/common/auth_password_strength.css' %}">
<script src="{% static 'frontend/common/auth_ui_patch.js' %}"></script>
<link rel="stylesheet" href="{% static 'frontend/common/auth_password_strength_fix.css' %}">
<script src="{% static 'frontend/common/auth_ui_patch_position_fix.js' %}"></script>

<script src="{% static 'frontend/common/auth_ui_patch.js' %}"></script>
<script src="{% static 'frontend/common/auth_ui_patch_position_fix.js' %}"></script>

<script src="{% static 'frontend/registration/form.js' %}"></script>
</body>
</html>
