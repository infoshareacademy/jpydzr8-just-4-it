<!DOCTYPE html>

{% load static %}
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Logged out</title>
  <link rel="stylesheet" href="{% static 'frontend/goodbye/logout_goodbye_white.css' %}" />
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
</head>
<body>

  <div class="goodbye-intro" aria-hidden="true">
    <div class="goodbye-inner">
      <h1 class="goodbye-title" aria-label="Goodbye!">
        <span id="gbText" class="goodbye-word" data-text="Goodbye!"></span>
      </h1>
      <p class="goodbye-sub">See you soon 👋</p>
    </div>
  </div>

  <div class="container goodbye-app">
    <div class="card">
      <h1>You’ve been logged out</h1>
      <p>Thanks for visiting. Come back anytime.</p>
      <div class="button-group">
        <a class="btn btn-primary" href="/login">Log in again</a>
        <a class="btn btn-tertiary" href="#">Close</a>
      </div>
    </div>
  </div>

  <script src="{% static 'frontend/goodbye/logout_goodbye_white.js' %}"></script>
</body>
</html>
