<!DOCTYPE html>

{% load static %}
{% load i18n %}
{% get_current_language as LANGUAGE_CODE %}
<html lang="{{ LANGUAGE_CODE }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% trans 'Application - Login' %}</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="{% static 'frontend/login/style_login_inputs_upgrade.css' %}">
</head>
<body>
  <div class="container">
    <div class="card">
      <div style="position: absolute; top: 20px; right: 20px;">
        {% include 'common/language_switcher.html' %}
      </div>
      <h1>{% trans 'Login' %}</h1>
      <p>{% trans 'Welcome back! Please enter your details to sign in.' %}</p>

      <form class="login-form" autocomplete="on">
        <div class="form-group">
          <label for="email">{% trans 'Email' %}</label>
          <input type="email" id="email" name="email" required>
        </div>

        <div class="form-group password-group">
          <label for="password">{% trans 'Password' %}</label>
          <div class="password-wrap">
            <input type="password" id="password" name="password" required>
            <button type="button" class="toggle-pass" aria-label="{% trans 'Show password' %}">👁️</button>
          </div>
        </div>

        <div class="form-row-minor">
          <label class="remember">
            <input type="checkbox" id="remember" name="remember">
            <span>{% trans 'Remember me' %}</span>
          </label>
          <a href="#" class="forgot">{% trans 'Forgot password?' %}</a>
        </div>

        <div class="button-group">
          <button type="submit" class="btn btn-primary">{% trans 'Log In' %}</button>
          <button type="button" class="btn btn-tertiary" id="btnBack" data-action="back">{% trans 'Back' %}</button>

        </div>
      </form>
    </div>
  </div>

  <script src="{% static 'frontend/login/script_login.js' %}"></script>

<script>
(function(){
  const form = document.querySelector('form');
  if (!form) return;

  form.addEventListener('submit', async (e)=>{
    e.preventDefault();
    const email = form.querySelector('[name=email]').value.trim();
    const password = form.querySelector('[name=password]').value;

    try{
      const res = await fetch('/api/auth/login', {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ email, password })
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.detail || 'Login failed');

      localStorage.setItem('token', data.access_token || data.token);
      window.location.href = '/dashboard';
    }catch(err){
      alert(err.message || String(err));
    }
  });
})();
</script>

<script>
(function(){
  var pwd = document.querySelector('#password,[name=password]');
  var btn = document.querySelector('.toggle-pass,[data-password-toggle]');
  if(pwd && btn){
    btn.addEventListener('click', function(){ pwd.type = (pwd.type === 'password' ? 'text' : 'password'); });
  }
})();

(function(){
  var back = document.querySelector('#btnBack,[data-action="back"],.btn-tertiary');
  if(back){
    back.addEventListener('click', function(e){
      e.preventDefault();
      var href = back.getAttribute('data-href');
      if(href){ location.href = href; }
      else if(document.referrer){ history.back(); }
      else { location.href = '/welcome/index.html'; }
    });
  }
})();
</script>
<link rel="stylesheet" href="{% static 'frontend/common/auth_password_strength.css' %}">
<script src="{% static 'frontend/common/auth_ui_patch.js' %}"></script>
<link rel="stylesheet" href="{% static 'frontend/common/auth_password_strength.css' %}">
<script src="{% static 'frontend/common/auth_ui_patch.js' %}"></script>
<link rel="stylesheet" href="{% static 'frontend/common/auth_password_strength_fix.css' %}">
<script src="{% static 'frontend/common/auth_ui_patch_position_fix.js' %}"></script>

</body>
</html>
