{% extends "admin/base_site.html" %}
{% block content %}
<h1>Generate seats</h1>
<form method="post" style="display:grid;grid-template-columns:repeat(2, minmax(240px,1fr));gap:12px;max-width:640px">
  {% csrf_token %}
  <label>Floor<input type="number" name="floor" value="5" required></label>
  <label>Rows<input type="number" name="rows" value="12" required></label>
  <label>Prefix<input type="text" name="prefix" placeholder="5"></label>
  <label>Pad length<input type="number" name="pad" value="2"></label>
  <div style="grid-column:1/-1">
    <button class="button default">Generate</button>
    <a href="{% url 'admin:coworking_seat_changelist' %}" class="button">Cancel</a>
  </div>
</form>
<p style="margin-top:8px;color:#555">Example: Floor=5, Rows=12, Prefix=5, Pad=2 → 5-01 … 5-12</p>
{% endblock %}
