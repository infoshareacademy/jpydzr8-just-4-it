{% load i18n %}
<div class="flex flex-col sm:flex-row items-start sm:items-center gap-3">
  <div class="flex items-center gap-2">
    <svg class="w-5 h-5 text-purple-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z"></path>
    </svg>
    <span class="text-sm font-medium text-slate-700">{% trans 'AI Assistant' %}</span>
  </div>
  
  <form class="flex flex-wrap items-center gap-2" onsubmit="event.preventDefault(); aiRecommend();">
    <div class="flex items-center gap-2">
      <label class="text-xs font-medium text-slate-600">{% trans 'Preferences' %}:</label>
      <div class="flex items-center gap-1">
        <label class="flex items-center gap-1 text-xs text-slate-600 hover:text-slate-800 cursor-pointer">
          <input type="checkbox" id="pref_dock" class="w-3 h-3 text-blue-600 border-slate-300 rounded focus:ring-blue-500">
          {% trans 'Dock' %}
        </label>
        <label class="flex items-center gap-1 text-xs text-slate-600 hover:text-slate-800 cursor-pointer">
          <input type="checkbox" id="pref_dual" class="w-3 h-3 text-blue-600 border-slate-300 rounded focus:ring-blue-500">
          {% trans 'Dual Monitors' %}
        </label>
        <label class="flex items-center gap-1 text-xs text-slate-600 hover:text-slate-800 cursor-pointer">
          <input type="checkbox" id="pref_adjust" class="w-3 h-3 text-blue-600 border-slate-300 rounded focus:ring-blue-500">
          {% trans 'Adjustable' %}
        </label>
        <label class="flex items-center gap-1 text-xs text-slate-600 hover:text-slate-800 cursor-pointer">
          <input type="checkbox" id="pref_deep" class="w-3 h-3 text-blue-600 border-slate-300 rounded focus:ring-blue-500">
          {% trans 'Deep Work' %}
        </label>
      </div>
    </div>
    
    <div class="flex items-center gap-2">
      <input type="date" id="pref_date" class="px-2 py-1 text-xs border border-slate-300 rounded focus:ring-2 focus:ring-blue-500 focus:border-blue-500" value="">
      <input type="time" id="pref_from" class="px-2 py-1 text-xs border border-slate-300 rounded focus:ring-2 focus:ring-blue-500 focus:border-blue-500" value="09:00">
      <input type="time" id="pref_to" class="px-2 py-1 text-xs border border-slate-300 rounded focus:ring-2 focus:ring-blue-500 focus:border-blue-500" value="17:00">
    </div>
    
    <div class="flex items-center gap-2">
      <button class="inline-flex items-center gap-1 px-3 py-1.5 bg-gradient-to-r from-emerald-500 to-emerald-600 text-white rounded-lg hover:from-emerald-600 hover:to-emerald-700 transition-all duration-200 shadow-sm hover:shadow-md text-xs font-medium">
        <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z"></path>
        </svg>
        {% trans 'Recommend' %}
      </button>
      <button type="button" onclick="aiFavorites()" class="inline-flex items-center gap-1 px-3 py-1.5 bg-gradient-to-r from-pink-500 to-pink-600 text-white rounded-lg hover:from-pink-600 hover:to-pink-700 transition-all duration-200 shadow-sm hover:shadow-md text-xs font-medium">
        <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"></path>
        </svg>
        {% trans 'Your Favorites' %}
      </button>
      <button type="button" onclick="aiSurprise()" class="inline-flex items-center gap-1 px-3 py-1.5 bg-gradient-to-r from-slate-600 to-slate-700 text-white rounded-lg hover:from-slate-700 hover:to-slate-800 transition-all duration-200 shadow-sm hover:shadow-md text-xs font-medium">
        <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.228 9c.549-1.165 2.03-2 3.772-2 2.21 0 4 1.343 4 3 0 1.4-1.278 2.575-3.006 2.907-.542.104-.994.54-.994 1.093m0 3h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
        </svg>
        {% trans 'Surprise Me' %}
      </button>
    </div>
  </form>
</div>
<script>
async function aiRecommend(){
  const root = document.getElementById('floor-root');
  const floor = root?.dataset?.floor || (location.pathname.split('/').filter(Boolean)[1]||'4');
  const q = new URLSearchParams({
    dock: pref_dock.checked ? '1':'',
    dual: pref_dual.checked ? '1':'',
    adjustable: pref_adjust.checked ? '1':'',
    deep: pref_deep.checked ? '1':'',
    date: pref_date.value || '',
    from: pref_from.value || '09:00',
    to:   pref_to.value || '17:00',
  }).toString();
  const resp = await fetch(`/reservations/floor/${floor}/ai/recommend/?` + q);
  const data = await resp.json();
  if (data.results?.length) {
    htmx.ajax('GET', `/reservations/desk/${data.results[0].id}/modal/`, {target:'#modal-root', swap:'innerHTML'});
  } else { alert("{% trans 'No recommendations.' %}"); }
}
async function aiFavorites(){
  const root = document.getElementById('floor-root');
  const floor = root?.dataset?.floor || (location.pathname.split('/').filter(Boolean)[1]||'4');
  const email = prompt('{% trans "Enter your email to see favorite desks:" %}');
  if (!email) return;
  
  // {% trans 'Set default date to today if no date selected' %}
  let date = document.getElementById('pref_date')?.value;
  if (!date) {
    const today = new Date();
    date = today.toISOString().split('T')[0];
  }
  
  const q = new URLSearchParams({
    email: email,
    date: date,
    from: document.getElementById('pref_from')?.value || '09:00',
    to: document.getElementById('pref_to')?.value || '17:00',
    dock: document.getElementById('pref_dock')?.checked || false,
    dual: document.getElementById('pref_dual')?.checked || false,
    adjustable: document.getElementById('pref_adjustable')?.checked || false,
    deep: document.getElementById('pref_deep')?.checked || false
  }).toString();
  
  try {
    console.log('{% trans "Sending request to:" %}', `/reservations/floor/${floor}/ai/favorites/?${q}`);
    const res = await fetch(`/reservations/floor/${floor}/ai/favorites/?${q}`);
    
    if (!res.ok) {
      throw new Error(`HTTP ${res.status}: ${res.statusText}`);
    }
    
    const data = await res.json();
    console.log('{% trans "Response:" %}', data);
    
    if (data.favorites && data.favorites.length > 0) {
      // {% trans 'Highlight favorite seats' %}
      data.favorites.forEach(desk => {
        const el = document.getElementById('seat-'+desk.id);
        if (el) {
          el.style.animation = 'pulse 2s infinite';
          el.style.fill = '#ec4899'; // {% trans 'Pink color for favorites' %}
          setTimeout(() => {
            el.style.animation = '';
            el.style.fill = '';
          }, 5000);
        }
      });
      if (typeof toast !== 'undefined') {
        toast('💖 ' + data.message);
      } else {
        alert('💖 ' + data.message);
      }
    } else {
      if (typeof toast !== 'undefined') {
        toast('💔 ' + (data.error || '{% trans "No favorite desks. Set preferences!" %}'));
      } else {
        alert('💔 ' + (data.error || '{% trans "No favorite desks. Set preferences!" %}'));
      }
    }
  } catch (e) {
    console.error('{% trans "Error:" %}', e);
    if (typeof toast !== 'undefined') {
      toast('❌ {% trans "Error:" %} ' + e.message);
    } else {
      alert('❌ {% trans "Error:" %} ' + e.message);
    }
  }
}

async function aiSurprise(){
  const root = document.getElementById('floor-root');
  const floor = root?.dataset?.floor || (location.pathname.split('/').filter(Boolean)[1]||'4');
  const q = new URLSearchParams({
    date: pref_date.value || '',
    from: pref_from.value || '09:00',
    to:   pref_to.value || '17:00',
  }).toString();
  const resp = await fetch(`/reservations/floor/${floor}/ai/surprise/?` + q);
  const data = await resp.json();
  if (data.result) {
    htmx.ajax('GET', `/reservations/desk/${data.result.id}/modal/`, {target:'#modal-root', swap:'innerHTML'});
  } else { alert("{% trans 'No available seats.' %}");   }
}

// {% trans 'Set default date on page load' %}
document.addEventListener('DOMContentLoaded', function() {
  const dateInput = document.getElementById('pref_date');
  if (dateInput && !dateInput.value) {
    const today = new Date();
    dateInput.value = today.toISOString().split('T')[0];
  }
});
</script>
