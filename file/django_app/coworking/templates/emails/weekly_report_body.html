<div style="font-family: Arial, sans-serif; max-width: 640px; margin: 0 auto; padding: 20px; background:#f8fafc;">
  <div style="background: linear-gradient(135deg, #4c51bf 0%, #2b6cb0 100%); color: white; padding: 24px; border-radius: 10px 10px 0 0; text-align: center;">
    <h1 style="margin: 0; font-size: 22px;">Tygodniowy raport rezerwacji</h1>
  </div>
  <div style="background: #ffffff; padding: 24px; border:1px solid #e2e8f0; border-radius: 0 0 10px 10px;">
    <p style="margin:6px 0;">Suma rezerwacji: <strong>{{ total }}</strong></p>
    <p style="margin:6px 0;">Ulubione stanowisko: <strong>{{ favorite_desk }}</strong></p>
    <p style="margin:6px 0;">Ulubione piętro: <strong>{{ favorite_floor }}</strong></p>
    <p style="margin:6px 0;">Średni czas: <strong>{{ avg_duration }} h</strong></p>
    <p style="margin-top:16px;">Dziękujemy za korzystanie z {{ system_name }}!</p>
  </div>
</div>
