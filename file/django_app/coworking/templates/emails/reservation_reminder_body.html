<div style="font-family: Arial, sans-serif; max-width: 640px; margin: 0 auto; padding: 20px; background:#f8fafc;">
  <div style="background: linear-gradient(135deg, #38b2ac 0%, #4299e1 100%); color: white; padding: 24px; border-radius: 10px 10px 0 0; text-align: center;">
    <h1 style="margin: 0; font-size: 22px;">Przypomnienie o rezerwacji</h1>
    <p style="margin:6px 0 0 0; opacity:.9;">Za {{ minutes_before }} minut</p>
  </div>
  <div style="background: #ffffff; padding: 24px; border:1px solid #e2e8f0; border-radius: 0 0 10px 10px;">
    <p style="margin:6px 0;"><strong>Stanowisko:</strong> {{ desk_label }}{% if floor_number %} (Piętro {{ floor_number }}){% endif %}</p>
    <p style="margin:6px 0;"><strong>Data:</strong> {{ date_str }}</p>
    {% if time_from and time_to %}<p style="margin:6px 0;"><strong>Godziny:</strong> {{ time_from|time:\"H:i\" }} - {{ time_to|time:\"H:i\" }}</p>{% endif %}
    <p style="margin-top:16px;">Miłego dnia!</p>
  </div>
</div>
