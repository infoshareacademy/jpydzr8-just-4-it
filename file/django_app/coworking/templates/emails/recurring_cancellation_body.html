<div style="font-family: Arial, sans-serif; max-width: 640px; margin: 0 auto; padding: 20px; background:#f8fafc;">
  <div style="background: linear-gradient(135deg, #f56565 0%, #ed8936 100%); color: white; padding: 24px; border-radius: 10px 10px 0 0; text-align: center;">
    <h1 style="margin: 0; font-size: 22px;">Anulowano cykliczną rezerwację</h1>
  </div>
  <div style="background: #ffffff; padding: 24px; border:1px solid #e2e8f0; border-radius: 0 0 10px 10px;">
    <p style="margin:6px 0;"><strong>Stanowisko:</strong> {{ desk_label }} (Piętro {{ floor_number }})</p>
    <p style="margin:6px 0;">Zakres pierwotny: <strong>od {{ start_date }} do {{ end_date }}</strong></p>
    <p style="margin:6px 0;">Godziny: <strong>{{ time_from }} - {{ time_to }}</strong></p>
    <p style="margin:6px 0;">Częstotliwość: <strong>{{ frequency }}</strong></p>
  </div>\n</div>\n
